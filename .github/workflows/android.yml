name: Android build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: 安装 NDK / CMake（用 runner 自带的 Android SDK）
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 安装 patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: 构建 Android 原生网易引擎
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.0.12077973"
          export FB_ENGINE_JOBS=4
          npm run build:engine:android
      - name: 预编译 server / mobile bundle
        run: npm run build
      - name: 准备 release 签名（可选 secrets）
        env:
          KS_B64: ${{ secrets.CUBELOOM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > packaging/android/cubeloom-release.keystore
          fi
      - name: 构建 APK
        env:
          CUBELOOM_KEYSTORE_PASSWORD: ${{ secrets.CUBELOOM_KEYSTORE_PASSWORD }}
          CUBELOOM_KEY_ALIAS: ${{ secrets.CUBELOOM_KEY_ALIAS }}
          CUBELOOM_KEY_PASSWORD: ${{ secrets.CUBELOOM_KEY_PASSWORD }}
        run: npm run build:android
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: cubeloom-android
          path: dist-app/*.apk
          if-no-files-found: error
      - name: 附加到 Release（tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-app/*.apk
          fail_on_unmatched_files: false
