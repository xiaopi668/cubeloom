name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 沙箱与鉴权自测
        run: npm run check:sandbox

      - name: 启动冒烟测试
        run: |
          set -o pipefail
          FB_WS_PORT=11451 FB_CONTROL_PORT=11453 FB_JAVA_PORT=11454 \
            timeout 10 node node_modules/tsx/dist/cli.mjs main.ts 2>&1 | tee /tmp/boot.log || true
          echo "----- 启动日志 -----"
          cat /tmp/boot.log
          grep -q "WS 服务已启动" /tmp/boot.log
          grep -q "外部连接令牌" /tmp/boot.log

      - name: 检查品牌与许可文件
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f LICENSES/CyanQiuper-MIT.txt
          head -3 LICENSE | grep -q "GNU AFFERO GENERAL PUBLIC LICENSE"
          ! grep -rIl "site-server" --include="*.ts" src main.ts admin-server.ts
