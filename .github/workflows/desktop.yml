name: Desktop build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 解压网易机器人（内置到安装包）
        run: npm run setup:netease-bot
      - name: 预编译 server / desktop / mobile bundle
        run: npm run build
      - name: 打包（未签名）
        run: npx --yes electron-builder@26 --project build/desktop ${{ matrix.target }} --publish never
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cubeloom-${{ matrix.os }}
          path: |
            dist-app/*.AppImage
            dist-app/*.tar.gz
            dist-app/*.exe
            dist-app/*.zip
            dist-app/*.dmg
          if-no-files-found: ignore
      - name: 附加到 Release（tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-app/*.AppImage
            dist-app/*.tar.gz
            dist-app/*.exe
            dist-app/*.zip
            dist-app/*.dmg
          fail_on_unmatched_files: false
