plugins { id 'com.android.application' }

android {
    namespace 'io.github.cubeloom'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'io.github.cubeloom'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '0.1.6'

        ndk {
            // 真机主要 arm64；x86_64 给模拟器
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    def releaseStore = System.getenv("CUBELOOM_KEYSTORE") ?: "${rootDir}/cubeloom-release.keystore"
    def releaseStorePass = System.getenv("CUBELOOM_KEYSTORE_PASSWORD") ?: "cubeloom"
    def releaseAlias = System.getenv("CUBELOOM_KEY_ALIAS") ?: "cubeloom"
    def releaseKeyPass = System.getenv("CUBELOOM_KEY_PASSWORD") ?: releaseStorePass
    def hasReleaseKey = file(releaseStore).exists()

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(releaseStore)
                storePassword releaseStorePass
                keyAlias releaseAlias
                keyPassword releaseKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
