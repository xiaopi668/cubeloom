plugins { id 'com.android.application' }

android {
    namespace 'io.github.cubeloom'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'io.github.cubeloom'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            // 真机主要 arm64；x86_64 给模拟器
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
